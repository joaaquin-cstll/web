<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAPAS.HOP | Streetwear Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="#">
            <img src="img/Logo.jpeg" alt="Logo ZAPAS.HOP" class="site-logo">
        </a>
        
        <nav>
            <a href="#">Hombre</a>
            <a href="#">Mujer</a>
            <a href="#">Niños</a>
            <a href="#" class="nav-offer">Ofertas 🔥</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h1>El flow empieza<br>por los pies</h1>
            <p class="sub-hero">Descubre nuestra colección de Zapatilas. Los mejore diseños y comodidad máxima.</p>
            <a href="#" class="btn-cta">Comprar Ahora</a>
        </div>
        <div class="hero-image-placeholder">
            <p>[Imagen Principal]</p>
        </div>
    </section>

    <section class="products">
        <h2>Destacados de la semana</h2>
        <div class="grid">
            <div class="card">
                <div class="card-image"></div>
                <h3>Air Street Runner</h3>
                <p class="price">89,99€</p>
            </div>
            <div class="card">
                <div class="card-image"></div>
                <h3>Urban High Top</h3>
                <p class="price">120,00€</p>
            </div>
            <div class="card">
                <div class="card-image"></div>
                <h3>Classic Retro Red</h3>
                <p class="price">75,50€</p>
            </div>
        </div>
    </section>
</body>
</html>
